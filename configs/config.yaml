# Central configuration for the ads ranking system.
# Values here are defaults/placeholders — actual dataset paths and
# hyperparameters will be populated starting in Phase 1.

project:
  name: ads-ranking-system
  random_seed: 42

# ---------------------------------------------------------------------------
# Data paths
# ---------------------------------------------------------------------------
data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_file: data/processed/train.parquet
  val_file: data/processed/val.parquet
  test_file: data/processed/test.parquet
  target_column: clicked

# ---------------------------------------------------------------------------
# Criteo dataset (Phase 1 raw data source)
#
# The "sample" variant (~100K rows) is a subsampled, chronologically-ordered
# benchmark for CTR prediction. It has NO user_id, ad_id, session_id, or
# conversion label — see docs/criteo_dataset.md for the verified schema,
# licensing terms, and why this project does not use it for candidate
# generation or CVR. `raw_dir` is relative to the project root.
# ---------------------------------------------------------------------------
criteo:
  variant: sample   # only "sample" is supported by this project (see docs/criteo_dataset.md)
  raw_dir: data/raw/criteo
  archive_filename: dac_sample.tar.gz
  extracted_filename: dac_sample.txt
  source_url: https://huggingface.co/datasets/Recommenders/Criteo/resolve/main/dac_sample.tar.gz
  label_column: label
  num_numerical_features: 13
  num_categorical_features: 26

# ---------------------------------------------------------------------------
# Criteo Attribution Modeling for Bidding Dataset (recommendation-system
# component; see docs/attribution_modeling_design.md and
# docs/attribution_dataset_verification.md). Kept fully separate from the
# `criteo` (DAC) section above — used only for this project's own
# recommendation work, not the Microsoft Recommenders contribution.
#
# `split` defines the day-boundary (timestamp // 86400) chronological split:
# day < train_end_day -> train; train_end_day <= day < val_end_day ->
# validation; day >= val_end_day -> test. `cohort.warm_min_distinct_clicked_
# campaigns` is the verified threshold below which a user has no learnable
# relative-preference signal (see design doc §3B) — 5.39% of users meet it.
# ---------------------------------------------------------------------------
attribution:
  raw_dir: data/raw/attribution
  archive_filename: criteo_attribution_dataset.tsv.gz
  source_url: https://huggingface.co/datasets/criteo/criteo-attribution-dataset/resolve/main/criteo_attribution_dataset.tsv.gz
  split:
    train_end_day: 20
    val_end_day: 25
  cohort:
    warm_min_distinct_clicked_campaigns: 2
  retrieval:
    top_k: 10
  ranking:
    # First ranking-stage experiment (docs/ranking_problem_design.md,
    # docs/ctr_model.md): P(click | impression), trained only on real,
    # already-served impressions. `missing_value_strategy` documents how
    # `user_click_rate_before` (undefined for a user's first-ever impression)
    # is handled: left as NaN and passed to LightGBM's native missing-value
    # split handling, rather than filled with a magic-number sentinel.
    ctr_model:
      type: lightgbm
      missing_value_strategy: native_lightgbm
      categorical_features:
        - campaign
        - cat1
        - cat2
        - cat3
        - cat4
        - cat5
        - cat6
        - cat7
        - cat8
        - cat9
      training:
        num_boost_round: 500
        early_stopping_rounds: 30
      params:
        objective: binary
        metric: [auc, binary_logloss]
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 100
        seed: 42
        verbose: -1

# ---------------------------------------------------------------------------
# Feature engineering
# ---------------------------------------------------------------------------
features:
  categorical_columns: []
  numerical_columns: []
  id_columns:
    - user_id
    - ad_id

# ---------------------------------------------------------------------------
# Model parameters
# ---------------------------------------------------------------------------
model:
  ctr:
    type: lightgbm          # baseline: logistic_regression | lightgbm
    params:
      objective: binary
      metric: auc
      learning_rate: 0.05
      num_leaves: 31
      n_estimators: 500
      early_stopping_rounds: 50
  ranking:
    type: lambdamart         # placeholder for Phase 3
    params: {}

# ---------------------------------------------------------------------------
# Experiment settings
# ---------------------------------------------------------------------------
experiment:
  name: baseline
  tracking_dir: outputs/experiments
  metrics:
    - auc
    - logloss
    - ndcg@10
  train_val_test_split:
    strategy: time_based      # time_based | random
    val_size: 0.15
    test_size: 0.15
